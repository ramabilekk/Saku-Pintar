name: Build & Release SakuPintar APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build SakuPintar APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Using Android SDK at: $SDK_DIR"
          SDKMANAGER=$(command -v sdkmanager || find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
          fi

      - name: Restore Firebase & keystore config from GitHub Secrets (if configured)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            if python3 -m json.tool app/google-services.json >/dev/null 2>&1; then
              echo "Restored valid app/google-services.json from GitHub Secret."
            else
              echo "::warning::Secret GOOGLE_SERVICES_JSON bukan JSON yang valid dan dilewati."
              rm -f app/google-services.json
            fi
          fi
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
              echo "Restored debug.keystore from debug.keystore.base64"
            elif [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
              CLEAN_B64=$(printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]')
              if printf '%s' "$CLEAN_B64" | base64 -d > debug.keystore 2>/dev/null && \
                 keytool -list -keystore debug.keystore -storepass android >/dev/null 2>&1; then
                echo "Restored valid debug.keystore from GitHub Secret."
              else
                echo "::warning::Secret DEBUG_KEYSTORE_BASE64 tidak valid atau terpotong; membuat fallback debug.keystore."
                rm -f debug.keystore
              fi
            fi
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -noprompt \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated fallback debug.keystore via keytool"
          fi

      - name: Build Debug APK
        run: gradle assembleDebug -PappVersionCode=${{ github.run_number }} --no-daemon --stacktrace

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SakuPintar-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.0.${{ github.run_number }}"
          APK_NAME="SakuPintar-${TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          SHA1=$(keytool -list -v -keystore debug.keystore -storepass android 2>/dev/null | grep -m1 "SHA1:" | awk '{print $2}' || echo "N/A")
          if [ -f app/google-services.json ]; then
            FIREBASE_STATUS="Terpasang (siap login Google, Firestore, & Gemini AI)"
          else
            FIREBASE_STATUS="BELUM TERPASANG — tambahkan secret GOOGLE_SERVICES_JSON di GitHub lalu build ulang"
          fi
          NOTES="Build APK otomatis untuk SakuPintar v2.0 (${TAG}).
          - Versi Aplikasi: 2.0 (${TAG} • Build ${{ github.run_number }})
          - Firebase Config: ${FIREBASE_STATUS}
          - SHA-1 signing: ${SHA1}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" --clobber
            gh release edit "$TAG" --title "SakuPintar v2.0 (${TAG})" --notes "$NOTES" --latest
          else
            gh release create "$TAG" "$APK_NAME" \
              --title "SakuPintar v2.0 (${TAG})" \
              --notes "$NOTES" \
              --latest
          fi
