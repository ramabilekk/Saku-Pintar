name: Deploy SakuPintar Web & APK Promo Portal

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-web:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Firebase Web App config from GitHub Secrets (if configured)
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib

          cfg_path = pathlib.Path("web/firebase-config.js")
          api_key = os.environ.get("FIREBASE_WEB_API_KEY", "").strip()
          app_id = os.environ.get("FIREBASE_WEB_APP_ID", "").strip()
          if api_key and app_id:
              payload = {
                  "apiKey": api_key,
                  "authDomain": "gen-lang-client-0625297800.firebaseapp.com",
                  "projectId": "gen-lang-client-0625297800",
                  "storageBucket": "gen-lang-client-0625297800.firebasestorage.app",
                  "messagingSenderId": "707681832137",
                  "appId": app_id,
                  "databaseId": "ai-studio-android-sakupint-08a7bf75-99a1-4ee5-aa40-8cf441495ab6",
                  "githubRepo": "ramabilekk/Saku-Pintar",
                  "releasesPageUrl": "https://github.com/ramabilekk/Saku-Pintar/releases/latest",
                  "releasesApiUrl": "https://api.github.com/repos/ramabilekk/Saku-Pintar/releases/latest",
              }
              cfg_path.write_text(
                  "window.SAKUPINTAR_FIREBASE_CONFIG = " + json.dumps(payload, indent=2) + ";\n",
                  encoding="utf-8",
              )
              print("Injected Firebase Web config from GitHub Secrets.")
          else:
              print("FIREBASE_WEB_API_KEY / FIREBASE_WEB_APP_ID secrets not set; keeping Guest + manual Firebase Web config mode.")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload web artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
